apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: bot-trading
  labels:
    app.kubernetes.io/name: bot-trading
    app.kubernetes.io/component: monitor
spec:
  # No TLS block: HTTPS terminates upstream on the OCI load balancer, which
  # forwards plain HTTP to the `web` entryPoint.
  entryPoints:
    - web
  routes:
    # Higher priority so it wins over the catch-all below: /metrics and
    # /ready are denied at the edge by bot-trading-internal-paths.
    - kind: Rule
      match: Host(`bot-trading.ikigais.app`) && (PathPrefix(`/metrics`) || PathPrefix(`/ready`))
      priority: 200
      middlewares:
        - name: bot-trading-internal-paths
      services:
        - name: bot-trading
          port: 8080
    - kind: Rule
      match: Host(`bot-trading.ikigais.app`)
      priority: 100
      services:
        - name: bot-trading
          port: 8080
