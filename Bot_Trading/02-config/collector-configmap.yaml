# Collector configuration, kept out of the image on purpose.
#
# The universe, the timeframes and the lookbacks are research decisions that
# change far more often than the code does. Baking them into
# ghcr.io/gabrielwyp/bot-trading would mean rebuilding and re-rolling the image
# to widen the sweep; here a `kubectl apply` and the next scheduled run is
# enough.
#
# This ConfigMap is separate from `bot-trading-config` so that the monitor
# Deployment's environment is not touched by anything the collector needs.
apiVersion: v1
kind: ConfigMap
metadata:
  name: bot-trading-collector-config
  labels:
    app.kubernetes.io/name: bot-trading
    app.kubernetes.io/component: collector
data:
  # Public on-chain address. The Hyperliquid /info endpoint is unauthenticated,
  # so the collector needs no Secret of any kind -- and deliberately has none.
  HYPERLIQUID_ACCOUNT_ADDRESS: "0x50C41b0D0137B624BB83a63f69D955E16A6F4a90"

  # Mainnet, not testnet. Testnet history is worthless for research, and HIP-3
  # deployer dexes only exist here. The monitor's own ConfigMap still points at
  # testnet; the two are independent on purpose.
  HYPERLIQUID_BASE_URL: "https://api.hyperliquid.xyz"

  LOG_LEVEL: "INFO"

  # =========================================================================
  # Rate limiting. Read this before changing anything else.
  # =========================================================================
  # These three are consumed by the HTTP client inside the CLI, not by the
  # driver script, and that is the whole point.
  #
  # A pause between download units does NOT pace this workload, and that was
  # measured: a full-universe pull with a 1.0s pause between units still took
  # 53 HTTP 429 against 78 successful units in fifteen minutes -- 40% throttled
  # -- and fell to about one symbol per minute. The reason is that a unit is
  # not a request. One `download-funding` call paginates internally into
  # roughly ten back-to-back requests and a windowed candle fetch into two or
  # more, so a pause inserted by the caller lands between bursts and never
  # inside them.
  #
  # The gate therefore sits in the transport, where every request passes
  # through it including the pagination no caller can see.
  #
  # 0.75s = 80 requests/minute. Measured against live mainnet with retries
  # disabled so every 429 was counted, each phase run past 75 seconds so the
  # result is a sustained rate and not a burst allowance:
  #
  #     1.00s spacing ( 60/min),  70 requests: 0 throttled
  #     0.50s spacing (120/min), 160 requests: 0 throttled
  #     0.25s spacing (240/min), 320 requests: 38 throttled (12%)
  #
  # The ceiling is between 120 and 240 per minute; 80 is a third below the
  # fastest rate that measured clean. The margin is deliberate -- those are
  # 80-second samples from an idle address, and this job holds its rate for
  # hours from an IP shared with everything else on the node.
  #
  # Raise it to go faster; a wrong guess costs time, not data, because a
  # throttled request is retried rather than dropped.
  HYPERLIQUID_MIN_REQUEST_INTERVAL_SECONDS: "0.75"

  # A throttled request is retried at the point it happened, so one 429 never
  # fails a whole symbol upward. Six doublings from one second is about a
  # minute of total waiting, capped at 60s per attempt.
  HYPERLIQUID_MAX_RETRIES: "6"
  HYPERLIQUID_RETRY_BACKOFF_SECONDS: "1"

  # =========================================================================
  # Universe
  # =========================================================================
  # Namespaces to sweep. `main` is the unqualified perpetual universe (234
  # contracts); `xyz` is the only HIP-3 deployer dex with real turnover
  # (~$788M/24h against the main venue's ~$2,747M), 120 contracts. The two
  # universes are disjoint and the dex prefix is CASE-SENSITIVE and lower case:
  # `XYZ` answers HTTP 500.
  #
  # NOT included: km, flx, vntl and the other idle dexes. They report $0.00M
  # volume and zero open interest; a zero funding rate there is not cheap
  # carry, it means nothing trades, and the series would be noise.
  COLLECTOR_DEXES: "main xyz"

  # EMPTY MEANS THE FULL UNIVERSE, discovered at runtime from the venue's
  # `meta` response for each dex above -- 354 contracts today. It is not a
  # hardcoded list on purpose: a contract listed next week is collected on the
  # next run with no change here, and history that is not captured while it is
  # retained cannot be bought back later.
  #
  # Set it to a space-separated list to restrict the sweep instead, for example
  # while testing a change:
  #
  #   COLLECTOR_SYMBOLS: "BTC/USDC ETH/USDC xyz:SP500"
  #
  # A HIP-3 contract is spelled exactly as the venue names it, `<dex>:<ASSET>`.
  COLLECTOR_SYMBOLS: ""

  # =========================================================================
  # What to pull, and how far back
  # =========================================================================
  # `<interval>:<lookback_days>` pairs. RETENTION IS PER INTERVAL, and this is
  # the measurement that drives the whole design. Asking BTC for three years:
  #
  #   interval  candles  reaches back
  #        1m     5,156      3 days
  #        5m     5,032     17 days
  #       15m     5,011     52 days
  #        1h     5,003    208 days
  #        4h     5,000    833 days
  #        1d     2,217  2,216 days  (to 2020-08-19, six years)
  #
  # A single lookback is therefore wrong in both directions at once: the 210
  # days the previous version used truncated `1d` to a tenth of what exists and
  # wasted requests on `15m` asking for four times its retention. Each interval
  # gets its own, sized just past its own retention so nothing is clipped and
  # nothing is wasted:
  #
  #   1d:2600  (2,216 retained + margin, ~7 years)
  #   4h:950   (833 + margin)
  #   1h:240   (208 + margin)
  #   15m:65   (52 + margin)
  #
  # 1m and 5m are deliberately absent: 3 and 17 days of retention make them
  # impossible to accumulate meaningfully at any realistic schedule, and 1m
  # alone would be 525,600 rows/asset/year.
  COLLECTOR_INTERVALS: "1d:2600 4h:950 1h:240 15m:65"

  # Funding is hourly and is not derivable from candles, so a perpetual
  # backtest is dishonest without it. One series per contract, no timeframe.
  COLLECTOR_FUNDING: "true"

  # Funding retention is by listing date rather than a row cap -- 28,730 rows
  # measured on ATOM, about 3.3 years. Asking earlier than a contract's listing
  # costs nothing: the walk stops as soon as a page comes back empty.
  COLLECTOR_FUNDING_LOOKBACK_DAYS: "2600"

  # =========================================================================
  # Deep first run, cheap afterwards
  # =========================================================================
  # The first run is a deep pull of the full universe and takes hours: ~10,600
  # requests at 0.75s spacing is ~2.2h, plus subprocess overhead, call it 2.5-3h.
  # That is expected, and the CronJob's activeDeadlineSeconds is sized for it.
  #
  # Every later run only needs the bars that have closed since, so it asks for
  # this many days instead -- one request per candle unit and one funding page,
  # ~35 minutes for the whole universe. The overlap is what keeps it
  # self-healing: a run that failed is backfilled by the next one.
  COLLECTOR_INCREMENTAL_DAYS: "7"

  # ...but not forever. A unit whose last deep pull is older than this is pulled
  # deep again, so any hole older than the incremental window is eventually
  # refilled rather than becoming permanent. Progress is recorded per unit in
  # `.collector-state.json` on the volume, so a deep run cut short by the
  # deadline resumes where it stopped instead of starting over.
  COLLECTOR_DEEP_REFRESH_DAYS: "30"

  # Pacing is the HTTP client's job (see the top of this file); this is only a
  # coarse extra brake for an operator who wants the job to tread even more
  # lightly. Zero is correct: a pause here would slow the gaps between bursts
  # without slowing the bursts.
  COLLECTOR_PAUSE_SECONDS: "0"

  # A single hung download can never eat the whole run's deadline. Generous
  # because a deep funding pull is ~60 paginated requests at 0.75s plus any
  # backoff, which is minutes rather than seconds.
  COLLECTOR_UNIT_TIMEOUT_SECONDS: "900"

  COLLECTOR_CACHE_DIR: "/var/lib/bot-trading/cache"
---
# The collector driver, mounted read-only rather than baked into the image, for
# the same reason as the universe above: it is operational glue over the shipped
# CLI, not application code. It drives `trading-bot hyperliquid markets`,
# `trading-bot download` and `trading-bot download-funding` one subprocess at a
# time so that a single dead contract cannot take the rest of the universe down
# with it.
apiVersion: v1
kind: ConfigMap
metadata:
  name: bot-trading-collector-script
  labels:
    app.kubernetes.io/name: bot-trading
    app.kubernetes.io/component: collector
data:
  collect.py: |
    """Accumulate the full Hyperliquid market history into the mounted cache.

    Hyperliquid's retention is a sliding window and it is PER INTERVAL: ~5000
    candles each, which is 3 days at 1m, 52 days at 15m, 208 days at 1h, 833 days
    at 4h and six years at 1d. A bar that is not captured before it ages out is
    gone for good. This job turns that window into a growing archive.

    Three things it does that the naive version did not:

    * **Per-interval lookbacks.** One fixed lookback is wrong in both directions
      simultaneously -- it truncates 1d to a fraction of what exists while asking
      15m for four times its retention.
    * **The full universe, discovered at runtime.** Every contract on every
      configured dex, read from the venue's own `meta`, so a contract listed next
      week is collected on the next run without anyone editing a list.
    * **Deep once, incremental after.** The first run pulls everything retained and
      takes hours. Later runs ask only for the days since, and re-deepen a unit
      once its last deep pull ages out. Progress is recorded per unit on the
      volume, so a run cut short by the deadline resumes rather than restarts.

    Rate limiting is NOT done here, deliberately. It lives in the HTTP client
    inside the CLI, because a unit is not a request: one funding pull paginates
    into ~10 back-to-back calls that no pause out here can see. Measured, a 1.0s
    pause between units still produced 40% HTTP 429. See
    HYPERLIQUID_MIN_REQUEST_INTERVAL_SECONDS in the ConfigMap.

    It drives the shipped CLI as a subprocess per unit of work. That is deliberate:
    one dead contract -- delisted, illiquid, or renamed by its HIP-3 deployer --
    must not take the other 353 down with it.

    Every line written to stdout is one JSON object carrying exactly the five
    fields the cluster's promtail pipeline parses: ``level``, ``message``,
    ``service``, ``requestId`` and ``timestamp``. Nothing is added, renamed or
    dropped; per-unit detail goes inside ``message`` as ``key=value`` pairs.
    """

    from __future__ import annotations

    import json
    import os
    import subprocess
    import sys
    import time
    import uuid
    from datetime import UTC, datetime, timedelta
    from pathlib import Path

    #: Value of the ``service`` field on every line, matching the monitor's
    #: convention (``bot-trading-monitor``) so both workloads share a dashboard.
    SERVICE_NAME = "bot-trading-collector"

    #: Executable the units are driven through. It is on PATH because the image
    #: puts the virtualenv's bin directory first.
    CLI = "trading-bot"

    #: Per-unit progress, stored on the volume beside the cache. Dot-prefixed so it
    #: never collides with a contract named STATE.
    STATE_FILE = ".collector-state.json"

    #: Order units are attempted in, deepest and least recoverable first. A run cut
    #: short by the deadline should have captured the history that cannot be
    #: re-fetched later: 1d reaches six years back and 4h reaches 833 days, while
    #: 1h and 15m are re-pulled in full by any run within their own retention.
    #: Funding sits between them -- years deep, but ~60 paginated requests a unit.
    UNIT_PRIORITY = ("1d", "4h", "funding", "1h", "15m")


    def _rfc3339_nano(moment: datetime) -> str:
        """Format an instant the way the log pipeline expects.

        Python resolves wall clock time to microseconds, so the last three digits
        are always zero; nine fractional digits are still emitted because that is
        the shape ``RFC3339Nano`` parsing wants.
        """
        return f"{moment:%Y-%m-%dT%H:%M:%S}.{moment.microsecond:06d}000Z"


    def log(level: str, message: str, run_id: str) -> None:
        """Write one structured line to stdout."""
        payload = {
            "level": level,
            "message": message,
            "service": SERVICE_NAME,
            "requestId": run_id,
            "timestamp": _rfc3339_nano(datetime.now(tz=UTC)),
        }
        print(json.dumps(payload, separators=(",", ":"), ensure_ascii=False), flush=True)


    def env_text(name: str, default: str) -> str:
        """Read a trimmed environment value, falling back when unset or blank."""
        return os.environ.get(name, "").strip() or default


    def env_int(name: str, default: int, minimum: int = 1) -> int:
        """Read an integer environment value, falling back when unusable.

        Args:
            name: Variable to read.
            default: Value used when unset, blank or not a number.
            minimum: Smallest value accepted. 0 where disabling the setting is
                meaningful, such as the inter-unit pause.

        """
        try:
            value = int(env_text(name, str(default)))
        except ValueError:
            return default
        return value if value >= minimum else default


    def env_float(name: str, default: float, minimum: float = 0.0) -> float:
        """Read a float environment value, falling back when unusable."""
        try:
            value = float(env_text(name, str(default)))
        except ValueError:
            return default
        return value if value >= minimum else default


    def env_flag(name: str, default: bool) -> bool:
        """Read a boolean environment value."""
        return env_text(name, str(default).lower()).lower() not in {"false", "0", "no"}


    def parse_intervals(raw: str, run_id: str) -> list[tuple[str, int]]:
        """Parse ``<interval>:<lookback_days>`` pairs.

        A malformed pair is skipped loudly rather than silently defaulted: a
        lookback that quietly became 210 days would truncate the 1d archive to a
        tenth of what the venue still holds, and nothing downstream would say so.

        Args:
            raw: Space-separated pairs, for example ``"1d:2600 4h:950"``.
            run_id: Correlation id for the log line.

        Returns:
            The parsed pairs, in the order given.

        """
        parsed: list[tuple[str, int]] = []
        for token in raw.split():
            interval, _, days = token.partition(":")
            if not interval or not days.isdigit() or int(days) < 1:
                log("WARN", f"ignoring malformed interval spec spec={token}", run_id)
                continue
            parsed.append((interval, int(days)))
        return parsed


    def summarise(stdout: str) -> str:
        """Condense a CLI report into one ``key=value`` fragment.

        The CLI prints pipe-delimited rows such as ``stored|5040``. Only the counts
        and the range are worth carrying into a log line.
        """
        wanted = (
            "downloaded",
            "stored",
            "first_open_time",
            "last_open_time",
            "first_stamp",
            "last_stamp",
        )
        parts = []
        for line in stdout.splitlines():
            key, _, value = line.partition("|")
            if key in wanted and value:
                parts.append(f"{key}={value}")
        return " ".join(parts)


    def downloaded_rows(stdout: str) -> int:
        """Return how many rows the venue actually returned, or -1 if unreported."""
        for line in stdout.splitlines():
            key, _, value = line.partition("|")
            if key == "downloaded" and value.isdigit():
                return int(value)
        return -1


    def count_throttles(stderr: str) -> int:
        """Return how many requests the client had to retry for HTTP 429.

        The client logs one ``hyperliquid_throttled`` line per retry at WARNING, so
        this is free to collect and is the earliest warning an operator gets that
        the configured spacing has become too fast for the venue.
        """
        return stderr.count("hyperliquid_throttled")


    def first_error(stdout: str, stderr: str) -> str:
        """Return a single-line reason for a failed unit."""
        for stream in (stderr, stdout):
            for line in reversed(stream.strip().splitlines()):
                if line.strip() and "hyperliquid_throttled" not in line:
                    return line.strip()[:300]
        return "no output"


    def run_unit(argv: list[str], timeout: int) -> tuple[str | None, str, int]:
        """Run one CLI invocation, never letting it raise.

        Returns:
            The stdout when the unit succeeded and ``None`` when it did not, a
            one-line summary or reason, and how many times the client was throttled.

        """
        try:
            completed = subprocess.run(  # noqa: S603 - fixed argv, no shell
                argv,
                capture_output=True,
                text=True,
                timeout=timeout,
                check=False,
            )
        except subprocess.TimeoutExpired:
            return None, f"timeout after {timeout}s", 0
        except OSError as exc:
            return None, f"could not start {CLI}: {exc}", 0

        throttles = count_throttles(completed.stderr)
        if completed.returncode == 0:
            return completed.stdout, summarise(completed.stdout), throttles
        reason = first_error(completed.stdout, completed.stderr)
        return None, f"exit={completed.returncode} {reason}", throttles


    def discover_universe(dexes: list[str], timeout: int, run_id: str) -> list[str]:
        """Read every contract of every configured dex from the venue itself.

        A hardcoded basket goes stale silently: a contract listed after the list was
        written is never collected, and its history is unrecoverable once the
        retention window passes it. Asking ``meta`` costs one request per dex.

        Args:
            dexes: Namespace names; ``main`` means the unqualified universe.
            timeout: Per-request timeout in seconds.
            run_id: Correlation id for the log lines.

        Returns:
            Contract identifiers spelled as the venue names them, deduplicated and
            in venue order. HIP-3 contracts already carry their ``<dex>:`` prefix.

        """
        discovered: list[str] = []
        seen: set[str] = set()
        for dex in dexes:
            argv = [CLI, "hyperliquid", "markets"]
            if dex != "main":
                argv += ["--dex", dex]
            stdout, detail, _ = run_unit(argv, timeout)
            if stdout is None:
                log("ERROR", f"universe discovery failed dex={dex} reason={detail}", run_id)
                continue
            found = 0
            for line in stdout.splitlines():
                columns = line.split("|")
                # Data rows are `index|coin|max_leverage|size_decimals|...`; the
                # header shares the shape but not a numeric first column.
                if len(columns) == 6 and columns[0].isdigit() and columns[1]:
                    if columns[1] not in seen:
                        seen.add(columns[1])
                        discovered.append(columns[1])
                    found += 1
            log("INFO", f"universe discovered dex={dex} contracts={found}", run_id)
        return discovered


    def load_state(path: Path, run_id: str) -> dict[str, str]:
        """Read the per-unit deep-pull record, tolerating a missing or bad file.

        Losing this file is not a failure: every unit simply deep-pulls again,
        which is slow but correct. Refusing to start because of it would be worse.
        """
        try:
            raw = json.loads(path.read_text(encoding="utf-8"))
        except FileNotFoundError:
            return {}
        except (OSError, ValueError) as exc:
            log("WARN", f"collector state unreadable, treating every unit as new: {exc}", run_id)
            return {}
        if not isinstance(raw, dict):
            return {}
        return {str(key): str(value) for key, value in raw.items()}


    def save_state(path: Path, state: dict[str, str]) -> None:
        """Write the per-unit record atomically, never raising.

        Written after every completed deep unit rather than at the end, so a run
        killed by ``activeDeadlineSeconds`` mid-sweep keeps what it achieved. The
        temp-and-rename is the same shape the CSV cache uses.
        """
        temporary = path.with_name(f"{path.name}.tmp")
        try:
            temporary.write_text(json.dumps(state, separators=(",", ":")), encoding="utf-8")
            os.replace(temporary, path)
        except OSError:
            # A state write is an optimisation. Losing it costs a deep re-pull next
            # run; failing the sweep over it would cost the whole run.
            temporary.unlink(missing_ok=True)


    def is_warm(state: dict[str, str], key: str, refresh_days: int, now: datetime) -> bool:
        """Return True when this unit was deep-pulled recently enough to skip one."""
        stamp = state.get(key)
        if not stamp:
            return False
        try:
            last = datetime.fromisoformat(stamp)
        except ValueError:
            return False
        if last.tzinfo is None:
            return False
        return now - last < timedelta(days=refresh_days)


    def build_units(
        symbols: list[str],
        intervals: list[tuple[str, int]],
        collect_funding: bool,
        funding_days: int,
    ) -> list[tuple[str, str, str, int]]:
        """Return every unit of work, deepest interval first.

        Ordered by :data:`UNIT_PRIORITY` across the whole universe rather than
        symbol by symbol, so a first run that runs out of deadline has captured the
        six-year 1d series for every contract instead of every series for the first
        few contracts.

        Returns:
            ``(label, symbol, interval_or_funding, lookback_days)`` tuples.

        """
        by_label: dict[str, list[tuple[str, str, str, int]]] = {}
        for symbol in symbols:
            for interval, days in intervals:
                by_label.setdefault(interval, []).append(
                    (f"candles:{interval}", symbol, interval, days)
                )
            if collect_funding:
                by_label.setdefault("funding", []).append(
                    ("funding", symbol, "funding", funding_days)
                )

        ordered: list[tuple[str, str, str, int]] = []
        for label in UNIT_PRIORITY:
            ordered.extend(by_label.pop(label, []))
        # Anything the operator added that is not in the priority list still runs,
        # just last, rather than being silently dropped.
        for remaining in by_label.values():
            ordered.extend(remaining)
        return ordered


    def main() -> int:
        """Collect the configured universe, tolerating individual failures."""
        run_id = str(uuid.uuid4())
        started = time.monotonic()

        cache_dir = env_text("COLLECTOR_CACHE_DIR", "/var/lib/bot-trading/cache")
        dexes = env_text("COLLECTOR_DEXES", "main").split()
        intervals = parse_intervals(
            env_text("COLLECTOR_INTERVALS", "1d:2600 4h:950 1h:240 15m:65"), run_id
        )
        collect_funding = env_flag("COLLECTOR_FUNDING", True)
        funding_days = env_int("COLLECTOR_FUNDING_LOOKBACK_DAYS", 2600)
        incremental_days = env_int("COLLECTOR_INCREMENTAL_DAYS", 7)
        refresh_days = env_int("COLLECTOR_DEEP_REFRESH_DAYS", 30)
        pause_seconds = env_float("COLLECTOR_PAUSE_SECONDS", 0.0)
        unit_timeout = env_int("COLLECTOR_UNIT_TIMEOUT_SECONDS", 900)

        if not intervals and not collect_funding:
            log("ERROR", "config error: no intervals and no funding, nothing to collect", run_id)
            return 1

        symbols = env_text("COLLECTOR_SYMBOLS", "").split()
        if symbols:
            log("INFO", f"universe restricted by COLLECTOR_SYMBOLS symbols={len(symbols)}", run_id)
        else:
            symbols = discover_universe(dexes, unit_timeout, run_id)
        if not symbols:
            log("ERROR", "no contracts to collect: discovery returned nothing", run_id)
            return 1

        state_path = Path(cache_dir) / STATE_FILE
        state = load_state(state_path, run_id)
        now = datetime.now(tz=UTC)

        units = build_units(symbols, intervals, collect_funding, funding_days)
        log(
            "INFO",
            f"run started symbols={len(symbols)} units={len(units)} dexes={','.join(dexes)} "
            f"intervals={' '.join(f'{i}:{d}' for i, d in intervals)} "
            f"funding={str(collect_funding).lower()} funding_days={funding_days} "
            f"incremental_days={incremental_days} deep_refresh_days={refresh_days} "
            f"cache_dir={cache_dir}",
            run_id,
        )

        ok: set[str] = set()
        failed: dict[str, int] = {}
        empty_units = 0
        deep_units = 0
        throttled_total = 0

        for index, (label, symbol, _kind, lookback_days) in enumerate(units, start=1):
            key = f"{symbol}|{label}"
            warm = is_warm(state, key, refresh_days, now)
            days = incremental_days if warm else lookback_days
            if not warm:
                deep_units += 1
            start = (now - timedelta(days=days)).date().isoformat()

            if label == "funding":
                argv = [CLI, "--cache-dir", cache_dir, "download-funding",
                        "--symbol", symbol, "--start", start]
            else:
                argv = [CLI, "--cache-dir", cache_dir, "download", "--symbol", symbol,
                        "--timeframe", _kind, "--start", start]

            stdout, detail, throttles = run_unit(argv, unit_timeout)
            throttled_total += throttles
            mode = "incremental" if warm else "deep"
            suffix = f" throttled={throttles}" if throttles else ""

            if stdout is None:
                failed[symbol] = failed.get(symbol, 0) + 1
                log(
                    "ERROR",
                    f"unit failed symbol={symbol} unit={label} mode={mode} "
                    f"start={start} reason={detail}{suffix}",
                    run_id,
                )
            else:
                ok.add(symbol)
                rows = downloaded_rows(stdout)
                if rows == 0:
                    # A delisted or never-traded contract answers with zero rows.
                    # That is an ANSWER, not an error: MATIC and UNI both do it.
                    # Counting it as a failure would make a healthy run look broken
                    # and would bury the failures that do matter.
                    empty_units += 1
                    log(
                        "INFO",
                        f"no data symbol={symbol} unit={label} mode={mode} start={start} "
                        f"(delisted or not yet trading){suffix}",
                        run_id,
                    )
                else:
                    if not warm:
                        state[key] = now.isoformat()
                        save_state(state_path, state)
                    log(
                        "INFO",
                        f"collected symbol={symbol} unit={label} mode={mode} {detail}{suffix}".strip(),
                        run_id,
                    )

            if index % 100 == 0:
                elapsed = int(time.monotonic() - started)
                log(
                    "INFO",
                    f"progress units={index}/{len(units)} ok_symbols={len(ok)} "
                    f"failed_units={sum(failed.values())} empty_units={empty_units} "
                    f"throttled={throttled_total} elapsed_seconds={elapsed}",
                    run_id,
                )

            if pause_seconds:
                time.sleep(pause_seconds)

        save_state(state_path, state)

        elapsed = int(time.monotonic() - started)
        dead = sorted(symbol for symbol in failed if symbol not in ok)
        failed_units = sum(failed.values())
        # A dead contract -- delisted, or an idle HIP-3 dex the deployer renamed --
        # must never fail the run. Only a run that collected nothing at all is a
        # real failure worth paging on.
        collected_nothing = not ok
        if throttled_total:
            log(
                "WARN",
                f"requests were throttled and retried throttled={throttled_total}; "
                "raise HYPERLIQUID_MIN_REQUEST_INTERVAL_SECONDS if this keeps growing",
                run_id,
            )
        log(
            "ERROR" if collected_nothing else "INFO",
            f"run finished symbols_ok={len(ok)}/{len(symbols)} units={len(units)} "
            f"deep_units={deep_units} failed_units={failed_units} empty_units={empty_units} "
            f"dead_symbols={len(dead)} throttled={throttled_total} elapsed_seconds={elapsed}"
            + (f" dead={','.join(dead[:20])}" if dead else ""),
            run_id,
        )
        return 1 if collected_nothing else 0


    if __name__ == "__main__":
        sys.exit(main())
