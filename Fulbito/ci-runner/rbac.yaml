apiVersion: v1
kind: ServiceAccount
metadata:
  name: fulbito-deployer
  labels:
    app.kubernetes.io/name: fulbito-runner
---
# Namespace-scoped: the runner can only manage the fulbito namespace.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: fulbito-deployer
  labels:
    app.kubernetes.io/name: fulbito-runner
rules:
  - apiGroups: [""]
    resources: [services, persistentvolumeclaims, configmaps, serviceaccounts]
    verbs: [get, list, watch, create, update, patch]
  - apiGroups: [""]
    resources: [secrets]
    resourceNames: [fulbito-admin]
    verbs: [get]
  - apiGroups: [""]
    resources: [pods, pods/log, events]
    verbs: [get, list, watch]
  - apiGroups: [apps]
    resources: [deployments, replicasets]
    verbs: [get, list, watch, create, update, patch]
  - apiGroups: [traefik.io]
    resources: [ingressroutes, middlewares]
    verbs: [get, list, watch, create, update, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: fulbito-deployer
  labels:
    app.kubernetes.io/name: fulbito-runner
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: fulbito-deployer
subjects:
  - kind: ServiceAccount
    name: fulbito-deployer
