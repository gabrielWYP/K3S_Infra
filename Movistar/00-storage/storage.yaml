apiVersion: v1
kind: PersistentVolume
metadata: {name: reto-movistar-sonia-live}
spec:
  capacity: {storage: 5Gi}
  accessModes: [ReadWriteOnce]
  persistentVolumeReclaimPolicy: Retain
  storageClassName: local-storage
  local: {path: /mnt/tesis_data/movistar}
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - {key: kubernetes.io/hostname, operator: In, values: [gabo-vm-arm]}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata: {name: sonia-live, namespace: reto-movistar}
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local-storage
  volumeName: reto-movistar-sonia-live
  resources: {requests: {storage: 5Gi}}
---
apiVersion: v1
kind: PersistentVolume
metadata: {name: reto-movistar-sonia-backups}
spec:
  capacity: {storage: 10Gi}
  accessModes: [ReadWriteOnce]
  persistentVolumeReclaimPolicy: Retain
  storageClassName: local-storage
  local: {path: /mnt/tesis_data/movistar-backups}
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - {key: kubernetes.io/hostname, operator: In, values: [gabo-vm-arm]}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata: {name: sonia-backups, namespace: reto-movistar}
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local-storage
  volumeName: reto-movistar-sonia-backups
  resources: {requests: {storage: 10Gi}}
