apiVersion: batch/v1
kind: Job
metadata: {name: reto-movistar-restore-REPLACE_RESTORE_ID, namespace: reto-movistar}
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 1800
  template:
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      nodeSelector: {kubernetes.io/hostname: gabo-vm-arm}
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: restore
          image: REPLACE_BACKEND_IMAGE
          env:
            - {name: BACKUP_NAME, value: REPLACE_BACKUP_NAME}
          command: [/bin/sh, -ec]
          args:
            - |
              case "${BACKUP_NAME}" in backup-*) ;; *) exit 2;; esac
              destination="/restore/restored-${BACKUP_NAME}"
              test ! -e "${destination}"
              python -c 'import sys; from pathlib import Path; from sonia.persistence.backup import StorageHardener; StorageHardener(Path("/var/lib/sonia")).restore(Path(sys.argv[1]), Path(sys.argv[2]))' "/backups/${BACKUP_NAME}" "${destination}"
          resources:
            requests: {cpu: 50m, memory: 128Mi}
            limits: {cpu: 500m, memory: 512Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: backups, mountPath: /backups, readOnly: true}
            - {name: restore, mountPath: /restore}
      volumes:
        - name: backups
          persistentVolumeClaim: {claimName: sonia-backups}
        - name: restore
          persistentVolumeClaim: {claimName: sonia-restore-target-REPLACE_RESTORE_ID}
