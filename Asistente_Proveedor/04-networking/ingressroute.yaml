apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: asistente-proveedor
  labels:
    app.kubernetes.io/name: asistente-proveedor
    app.kubernetes.io/component: web
spec:
  entryPoints:
    - web
  routes:
    - kind: Rule
      match: Host(`asistente-proveedor.ikigais.app`)
      priority: 100
      services:
        - name: asistente-proveedor-web
          port: 3000
