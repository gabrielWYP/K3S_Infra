name: Deploy Movistar

on:
  workflow_call:
    inputs:
      image-tag:
        description: Immutable frontend and backend image tag
        required: true
        type: string
      kube-namespace:
        description: Kubernetes namespace
        required: false
        default: reto-movistar
        type: string
      public-host:
        description: Public Traefik host
        required: false
        default: reto-movistar.ikigais.app
        type: string
    secrets:
      KUBECONFIG_B64:
        required: true
      GHCR_PULL_TOKEN:
        required: true
      OPENCODE_KEY:
        required: false

permissions:
  contents: read

concurrency:
  group: deploy-reto-movistar-${{ inputs.kube-namespace }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate manifests
    uses: gabrielwyp/K3S_Infra/.github/workflows/validate-manifests.yml@main
    with:
      manifest-path: Movistar

  deploy:
    name: Deploy to K3S
    needs: validate
    runs-on: self-hosted
    env:
      KUBE_NAMESPACE: ${{ inputs.kube-namespace }}
      PUBLIC_HOST: ${{ inputs.public-host }}
      IMAGE_TAG: ${{ inputs.image-tag }}
      KUBECONFIG: /tmp/reto-movistar-kubeconfig-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Checkout infrastructure
        uses: actions/checkout@v6
        with:
          repository: gabrielwyp/K3S_Infra
          ref: main

      - name: Validate deployment inputs
        env:
          KUBECONFIG_B64: ${{ secrets.KUBECONFIG_B64 }}
          GHCR_PULL_TOKEN: ${{ secrets.GHCR_PULL_TOKEN }}
          OPENCODE_KEY: ${{ secrets.OPENCODE_KEY }}
        run: |
          set -euo pipefail
          test "${KUBE_NAMESPACE}" = "reto-movistar" || {
            echo "::error::kube-namespace must be reto-movistar"
            exit 1
          }
          test "${PUBLIC_HOST}" = "reto-movistar.ikigais.app" || {
            echo "::error::public-host must be reto-movistar.ikigais.app"
            exit 1
          }
          [[ "${IMAGE_TAG}" =~ ^[a-zA-Z0-9][a-zA-Z0-9._-]{0,127}$ ]] || {
            echo "::error::Invalid OCI image tag"
            exit 1
          }
          for name in KUBECONFIG_B64 GHCR_PULL_TOKEN; do
            test -n "${!name:-}" || {
              echo "::error::Missing required secret: ${name}"
              exit 1
            }
          done
          if [ -z "${OPENCODE_KEY:-}" ]; then
            echo "::warning::OPENCODE_KEY is not configured; BI will use deterministic fallback"
          fi

      - name: Install kubectl
        run: |
          set -euo pipefail
          KUBECTL_VERSION="v1.34.3"
          ARCH="$(uname -m)"
          case "${ARCH}" in
            x86_64) ARCH_SUFFIX="amd64" ;;
            aarch64) ARCH_SUFFIX="arm64" ;;
            *) echo "Unsupported architecture: ${ARCH}"; exit 1 ;;
          esac

          INSTALL_DIR="${RUNNER_TEMP}/kubectl-${KUBECTL_VERSION}"
          mkdir -p "${INSTALL_DIR}"
          curl --fail --location --silent --show-error \
            "https://dl.k8s.io/release/${KUBECTL_VERSION}/bin/linux/${ARCH_SUFFIX}/kubectl" \
            --output "${INSTALL_DIR}/kubectl"
          curl --fail --location --silent --show-error \
            "https://dl.k8s.io/release/${KUBECTL_VERSION}/bin/linux/${ARCH_SUFFIX}/kubectl.sha256" \
            --output "${INSTALL_DIR}/kubectl.sha256"
          (
            cd "${INSTALL_DIR}"
            echo "$(cat kubectl.sha256)  kubectl" | sha256sum --check
          )
          chmod u+x "${INSTALL_DIR}/kubectl"
          echo "${INSTALL_DIR}" >> "${GITHUB_PATH}"
          "${INSTALL_DIR}/kubectl" version --client

      - name: Configure K3S access
        env:
          KUBECONFIG_B64: ${{ secrets.KUBECONFIG_B64 }}
        run: |
          set -euo pipefail
          umask 077
          printf '%s' "${KUBECONFIG_B64}" | base64 --decode > "${KUBECONFIG}"
          kubectl cluster-info
          kubectl create namespace "${KUBE_NAMESPACE}" --dry-run=client -o yaml | kubectl apply -f -

      - name: Reconcile GHCR pull secret
        env:
          GHCR_PULL_TOKEN: ${{ secrets.GHCR_PULL_TOKEN }}
          GHCR_USER: gabrielwyp
        run: |
          set -euo pipefail
          secret_dir="$(mktemp -d)"
          trap 'rm -rf "${secret_dir}"' EXIT
          chmod 700 "${secret_dir}"

          export GHCR_AUTH
          GHCR_AUTH="$(printf '%s:%s' "${GHCR_USER}" "${GHCR_PULL_TOKEN}" | base64 | tr -d '\n')"
          jq --null-input '{auths:{"ghcr.io":{username:env.GHCR_USER,password:env.GHCR_PULL_TOKEN,auth:env.GHCR_AUTH}}}' > "${secret_dir}/.dockerconfigjson"
          kubectl create secret generic ghcr-pull-secret \
            --type=kubernetes.io/dockerconfigjson \
            --from-file=.dockerconfigjson="${secret_dir}/.dockerconfigjson" \
            --namespace "${KUBE_NAMESPACE}" --dry-run=client -o yaml \
            | kubectl apply -f -

      - name: Reconcile OpenCode Go secret
        env:
          OPENCODE_KEY: ${{ secrets.OPENCODE_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${OPENCODE_KEY:-}" ]; then
            kubectl delete secret reto-movistar-opencode \
              --namespace "${KUBE_NAMESPACE}" --ignore-not-found
            echo "OPENCODE_KEY not configured; stale runtime secret removed"
            exit 0
          fi
          secret_dir="$(mktemp -d)"
          trap 'rm -rf "${secret_dir}"' EXIT
          chmod 700 "${secret_dir}"
          umask 077
          printf '%s' "${OPENCODE_KEY}" > "${secret_dir}/OPENCODE_KEY"
          kubectl create secret generic reto-movistar-opencode \
            --from-file=OPENCODE_KEY="${secret_dir}/OPENCODE_KEY" \
            --namespace "${KUBE_NAMESPACE}" --dry-run=client -o yaml \
            | kubectl apply -f -

      - name: Apply immutable release
        id: apply
        run: |
          set -euo pipefail
          if kubectl get deployment/reto-movistar --namespace "${KUBE_NAMESPACE}" > /dev/null 2>&1; then
            echo "LEGACY_DEPLOYMENT_PRESENT=true" >> "${GITHUB_ENV}"
          else
            echo "LEGACY_DEPLOYMENT_PRESENT=false" >> "${GITHUB_ENV}"
          fi
          sed -i "s/newTag: bootstrap/newTag: ${IMAGE_TAG}/g" Movistar/kustomization.yaml
          kubectl apply -k Movistar

      - name: Wait for backend rollout
        run: |
          set -euo pipefail
          kubectl rollout status deployment/reto-movistar-back --namespace "${KUBE_NAMESPACE}" --timeout=8m

      - name: Wait for frontend rollout
        run: |
          set -euo pipefail
          kubectl rollout status deployment/reto-movistar-front --namespace "${KUBE_NAMESPACE}" --timeout=8m

      - name: Verify OpenCode Go connectivity
        env:
          OPENCODE_KEY: ${{ secrets.OPENCODE_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${OPENCODE_KEY:-}" ]; then
            echo "OPENCODE_KEY not configured; skipping provider probe"
            exit 0
          fi
          kubectl exec deployment/reto-movistar-back \
            --namespace "${KUBE_NAMESPACE}" --container back -- \
            python -c 'from bi_agent.llm_runtime import OpenCodeRuntime; OpenCodeRuntime().probe()'

      - name: Verify internal services
        run: |
          set -euo pipefail
          kubectl run reto-movistar-back-health-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT} \
            --namespace "${KUBE_NAMESPACE}" --rm --restart=Never \
            --image=curlimages/curl:8.16.0 --attach --quiet -- \
            --fail --silent --show-error http://reto-movistar-back:8080/health
          kubectl run reto-movistar-front-health-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT} \
            --namespace "${KUBE_NAMESPACE}" --rm --restart=Never \
            --image=curlimages/curl:8.16.0 --attach --quiet -- \
            --fail --silent --show-error http://reto-movistar-front:8080/health
          kubectl run reto-movistar-agents-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT} \
            --namespace "${KUBE_NAMESPACE}" --rm --restart=Never \
            --image=curlimages/curl:8.16.0 --attach --quiet -- \
            --fail --silent --show-error http://reto-movistar-front:8080/api/agents

      - name: Verify public Host routing
        env:
          OPENCODE_KEY: ${{ secrets.OPENCODE_KEY }}
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --retry 6 --retry-delay 5 --retry-all-errors "https://${PUBLIC_HOST}/health" > /dev/null
          agents="$(curl --fail --silent --show-error --retry 6 --retry-delay 5 --retry-all-errors "https://${PUBLIC_HOST}/api/agents")"
          printf '%s' "${agents}" | jq --exit-status 'map(.agent_id) == ["billing", "collections", "bi"]' > /dev/null
          if [ -n "${OPENCODE_KEY:-}" ]; then
            bi_status="$(curl --fail --silent --show-error --retry 6 --retry-delay 5 --retry-all-errors "https://${PUBLIC_HOST}/api/bi/status")"
            printf '%s' "${bi_status}" | jq --exit-status \
              '.llm_available == true and .llm.provider == "opencode-go" and .llm.model == "deepseek-v4-flash"' \
              > /dev/null
          fi

      - name: Remove legacy single-pod workload
        if: success() && env.LEGACY_DEPLOYMENT_PRESENT == 'true'
        run: |
          set +e
          kubectl delete deployment/reto-movistar service/reto-movistar \
            --namespace "${KUBE_NAMESPACE}" --ignore-not-found || {
              echo "::warning::Two-pod release is healthy, but legacy cleanup failed"
            }

      - name: Roll back failed release
        if: failure()
        run: |
          set +e
          if [ "${LEGACY_DEPLOYMENT_PRESENT:-false}" = "true" ]; then
            kubectl patch ingressroute/reto-movistar \
              --namespace "${KUBE_NAMESPACE}" --type=json \
              --patch='[{"op":"replace","path":"/spec/routes/0/services/0/name","value":"reto-movistar"}]'
          else
            kubectl rollout undo deployment/reto-movistar-back --namespace "${KUBE_NAMESPACE}"
            kubectl rollout undo deployment/reto-movistar-front --namespace "${KUBE_NAMESPACE}"
          fi

      - name: Deployment diagnostics
        if: failure()
        run: |
          kubectl get deployments,pods,services,ingressroutes --namespace "${KUBE_NAMESPACE}" -o wide || true
          kubectl get events --namespace "${KUBE_NAMESPACE}" --sort-by='.lastTimestamp' | tail -30 || true

      - name: Remove kubeconfig
        if: always()
        run: rm -f "${KUBECONFIG}"
