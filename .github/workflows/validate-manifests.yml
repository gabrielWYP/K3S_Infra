name: Validate Kubernetes Manifests

on:
  workflow_call:
    inputs:
      manifest-path:
        description: 'Path to manifests directory (e.g., Business_Bot, Sentiment_Analysis)'
        required: true
        type: string

jobs:
  validate:
    name: Validate Manifests
    runs-on: self-hosted
    steps:
      - name: Checkout infra manifests
        uses: actions/checkout@v4
        with:
          repository: gabrielwyp/K3S_Infra

      - name: Install kubeconform
        run: |
          set -euo pipefail
          KUBECONFORM_VERSION="v0.6.7"
          ARCH=$(uname -m)
          case "$ARCH" in
            x86_64)  ARCH_SUFFIX="amd64" ;;
            aarch64) ARCH_SUFFIX="arm64" ;;
            armv7l)  ARCH_SUFFIX="armv6" ;;
            *)       echo "Unsupported architecture: $ARCH"; exit 1 ;;
          esac
          echo "Detected architecture: $ARCH -> $ARCH_SUFFIX"
          INSTALL_DIR="${RUNNER_TEMP}/kubeconform-${KUBECONFORM_VERSION}"
          ARCHIVE="${RUNNER_TEMP}/kubeconform-${ARCH_SUFFIX}.tar.gz"
          mkdir -p "${INSTALL_DIR}"
          wget -q \
            "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-${ARCH_SUFFIX}.tar.gz" \
            -O "${ARCHIVE}"
          tar -xzf "${ARCHIVE}" -C "${INSTALL_DIR}"
          chmod u+x "${INSTALL_DIR}/kubeconform"
          echo "${INSTALL_DIR}" >> "${GITHUB_PATH}"
          "${INSTALL_DIR}/kubeconform" -v

      - name: Validate Kubernetes schemas
        run: |
          echo "Validating manifests in ${{ inputs.manifest-path }}..."
          find ${{ inputs.manifest-path }} -name '*.yaml' \
            -not -name 'kustomization.yaml' \
            -not -name '*-patch.yaml' | \
            xargs kubeconform \
              -strict \
              -ignore-missing-schemas \
              -schema-location default \
              -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json' \
              -summary
          echo "Schema validation completed"

      - name: Install yamllint
        run: |
          set -euo pipefail
          VENV_DIR="${RUNNER_TEMP}/manifest-validation-venv"
          python3 -m venv "${VENV_DIR}"
          "${VENV_DIR}/bin/pip" install --quiet yamllint
          echo "${VENV_DIR}/bin" >> "${GITHUB_PATH}"

      - name: Lint YAML
        run: |
          echo "Linting YAML files in ${{ inputs.manifest-path }}..."
          find ${{ inputs.manifest-path }} -name '*.yaml' | xargs yamllint -d relaxed
          echo "YAML lint completed"
